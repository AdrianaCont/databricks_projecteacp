# This is a Declarative Automation Bundle definition for bakehouse_automotive.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: bakehouse_automotive
  uuid: b6abe57c-4ea1-403d-b82e-01f4ecdf78d3

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405618358208633.13.azuredatabricks.net
    variables:
      catalog: catalog
      schema: rnd
  prod:
    mode: production
    workspace:
      host: https://adb-7405611460044201.1.azuredatabricks.net/
      # We explicitly deploy to /Workspace/Users/eacp8471@hotmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/eacp8471@hotmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: catalog_prod
      schema: rnd
    permissions:
      - user_name: eacp8471@hotmail.com
        level: CAN_MANAGE
