# A sample job for bakehouse_automotive.

resources:
  jobs:
    bakehouse_automotive_refresh:
      name: bakehouse_automotive_refresh

      trigger:
        # Run this job every day, exactly one day from the last run; see https://docs.databricks.com/api/workspace/jobs/create#trigger
        periodic:
          interval: 1
          unit: DAYS

      #email_notifications:
      #  on_failure:
      #    - your_email@example.com

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      tasks:
        - task_key: preparation
          notebook_task:
            notebook_path: ../src/0.PreparacionAmbiente.ipynb
        - task_key: ingestaBronze
          notebook_task:
            notebook_path: ../src/1.IngestionBronze.ipynb
          depends_on:
            - task_key: preparation
        - task_key: transformationSilver
          notebook_task:
            notebook_path: ../src/2.transformationsSilver.ipynb
          depends_on:
            - task_key: ingestaBronze
        - task_key: analyticsGold
          notebook_task:
            notebook_path: ../src/3.analyticsGold.ipynb

          depends_on:
            - task_key: transformationSilver
      environments:
        - environment_key: default
          spec:
            environment_version: "5"
